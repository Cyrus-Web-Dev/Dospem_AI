<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Dospem · Atur ulang kata sandi</title>
<link rel="stylesheet" href="/base.css?v=2"><script src="/common.js?v=2"></script>
<style>main{max-width:440px;margin:0 auto;padding:24px 20px}input{width:100%;margin:6px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}#msg{min-height:1.3em}.ok{color:var(--accent)}</style></head><body>
<header class="top"><a class="brand" href="/">Dospem</a><span class="spacer"></span><button id="theme" class="icon" aria-label="Ganti tema terang/gelap" title="Ganti tema">◐</button></header>
<main><h1>Atur ulang kata sandi</h1>
<div id="form" hidden>
  <p class="empty">Pilih kata sandi baru untuk akunmu (minimal 8 karakter). Setelah berhasil, semua perangkat yang sedang masuk akan keluar otomatis.</p>
  <input id="p1" type="password" placeholder="Kata sandi baru" aria-label="Kata sandi baru" autocomplete="new-password">
  <input id="p2" type="password" placeholder="Ulangi kata sandi baru" aria-label="Ulangi kata sandi baru" autocomplete="new-password">
  <div class="row"><button id="go" class="primary" type="button">Simpan kata sandi baru</button></div>
</div>
<p id="msg" class="err" role="alert"></p>
<p id="done" hidden><a class="primary" href="/" style="display:inline-block;padding:8px 14px;border-radius:8px">Masuk ke Dospem</a></p>
<p id="bad" hidden>Tautan ini tidak lengkap. Minta tautan baru dari menu <b>Masuk</b> &rarr; <b>Lupa kata sandi?</b>.</p>
</main>
<script>
const m=/(?:^#|&)t=([A-Za-z0-9_-]{20,200})/.exec(location.hash);
const token=m&&m[1];
history.replaceState(null,'',location.pathname); /* buang token dari bilah alamat & riwayat */
if(token)$('#form').hidden=false;else $('#bad').hidden=false;
const say=(t,ok)=>{const e=$('#msg');e.textContent=t;e.className=ok?'ok':'err'};
$('#go').onclick=async()=>{
  const a=$('#p1').value,b=$('#p2').value;say('');
  if(a.length<8){say('Kata sandi minimal 8 karakter.');return}
  if(a!==b){say('Kedua kata sandi tidak sama.');return}
  const btn=$('#go');btn.disabled=true;
  try{const r=await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:a})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Gagal mengatur ulang kata sandi.');
    $('#form').hidden=true;$('#done').hidden=false;say('Kata sandi berhasil diganti. Silakan masuk dengan kata sandi baru.',true)}
  catch(e){say(e.message);btn.disabled=false}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#form').hidden)$('#go').click()});
</script></body></html>
