services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: {POSTGRES_USER: dospem, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: dospem}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U dospem"], interval: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env.prod
    depends_on: {db: {condition: service_healthy}}
    restart: "no"
  app:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}}
    expose: ["8000"]
  caddy:  # HTTPS otomatis (Let's Encrypt)
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]
    depends_on: [app]
volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
